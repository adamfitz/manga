name: Manual Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # REQUIRED for gh-release to publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          latest=$(git describe --tags --abbrev=0)
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libgl1-mesa-dev \
            xorg-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev

      - name: Build Linux packages
        run: |
          cd builds/deb
          make VERSION=${{ steps.tag.outputs.latest }}

      - name: Create GitHub Release (gh-release)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.latest }}
          name: ${{ steps.tag.outputs.latest }}
          draft: false
          prerelease: false
          omit_source: true
          files: |
            builds/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
